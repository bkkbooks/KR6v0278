body:
  text: 之一南面第一層標義門使范陽郡功曹盧宣儒典西曹掾解寶憐范陽縣使丞李承叔典西曹掾龍仲裕標異鄉義慈惠石柱頌元造義王興國義主路和仁元鄉葬十人等如左田市貴滑榮祖梁令奴田寶護陳顯仁鮮于法珍田顯和鄭映世田勍順史靈貴元貢義四人如左田鸞𮀷鄭貴和陳靈奴賈魏珍大齊大寧二年四月十七日省苻下標之九東面上層上考上座張季雍考上座田天愛都寺主田鸞峰寺主石顯周大居士馮昆上座李雙貴上座張買奴寺主吳景賓寺主曹承仙居士姚神龍上座任敬和上座梁孝慈寺主陳洪業寺主劉阿禮居士梁令奴上座田僧壽上座張明範寺主李思賓寺主趙僧首居士陳伯仁上座趙榮族上座梁景智寺主格元穆寺主趙僧定居士張順和上座龍難憎上座孟阿和寺主史長孫居士田遠達上座齊貴宗上座趙珍業寺主王元仲居士張世遷上座成顯伯上座陳令舉居士尹二洛上座任明軌上座牛顯榮寺主苟承伯寺主牛暉預居士卑元紹上座陳景洛上座寧石墨寺主史同珍寺主陳顯達居士邢子邦之二南面第二層施主嚴僧安施主嚴阿承施主嚴光璨施主嚴市顯施主嚴道業施主嚴惠仙施主嚴市念施主嚴天保初施義園宅地主篤信弟子嚴僧安故人嚴嚴法胤嚴僧芝嚴道業嚴惠仙嚴平仁等並解苦空仰慕祇陀之惠設供招納捨地置坊僧安自穿井定基立宅實是起義檀越今義坊園地西至舊官道中東盡明武城璜悉是嚴氏世墣田皆為種善來資欣捨無悔施主僧安夙植定因遭災無難荒後寶育男女並各端慧長子懷秀次息奉悅第三息懷達第四要欣憐並恭孝敬從父命之義十載有餘重施義南課田八十畝東至城門西屆舊官道中平坦良立文永施任義園食衆領蒔業普天共味隨時禮念願資檀主因茲感悟宗房相學廣施如左施主嚴承長息侍伯伯弟阿繼孝心純至為父母重施義東城壕城南兩段草畝地任義拓園種殖供賓冥資施主兾若把土來招輪施主嚴光璨璨弟市顯兄弟門華禮風儀並著兒孫端質鄉閭敬尚施心彌隆念福重義有甚人璨弟市顯顯息士林璨息惠房第三定興璨孫洪略共施武郭莊田四頃施心堅固衆雖廢莊任衆回便賣資莊田收利福用見修薄拘之因來受著提無盡之果之三西南面第二層施主李令第施主李小買施主嚴僧芝施主陳獨憐施主嚴道業業長息桃賓父子重義輕財為福捨地現招十利福獲提伽恣寶施主嚴惠仙仙長子阿懷弟子蘭及等義精誠弗悕世報各施地一畝任衆造園種牧濟義心度如海捨著為念施主嚴市念念大兒長長弟阿禮阿灰兄弟順仰慕亡考捨地卅畝嚴奉地與義作園利供一切願資亡者能存亡博惠離車洋羅非之四西北面明使君大行臺尚書令斛律荊山王施主嚴阿顯施主嚴智巖施主嚴樂平施主嚴智施主嚴遠郡施主嚴榮建施主嚴施主嚴道嵩施主嚴智順施主嚴阿二施主嚴賓之五東面義衆一切經生薑子蔡明使君斛律令公長息安東將軍使持節岐州諸軍事岐州刺史儀同三司內備身正都督臨邑縣開國子世達奉勑覲省假滿還都過義致敬王像納供欣喜因見標柱刊載大父名德遂降意手書官爵遣銘行由兾紹徽緒公第九息儀同三司駙馬都慰世遷貴乘天資孝心淳至娉娶公主過義禮拜因見之六東南面施主李叔賢施主李伯悅施主李胤寶施主李阿楷俳佪並有大祖咸陽王像令公爾朱郡君二菩薩立侍像側致敬無量公與銘名為俳佪主方許財力營搆義福寶息長賓定州軍士呂貴觀為亡父母施地入義之七北面李孝端田子承張士謙趙士花田郭買奴李子二李元暉楊業呂遵貴羅阿稱越達趙阿柳梁雍阿根李僧偃段道辨王未好陳阿季虎張曇賓牛景貴任始楊子曹胡王買苟張榮進衛那韓陀羅牛季紹石洪達陳僧伽孫阿略牛阿賈阿沖解勒長牛子道陳子保張殺鬼方思沈子遠魏景史遠成同稱董長雲鮮于沙門鮮于仲紹王子李子賓略鮮于文禮李敬王清田逍孫道榐田士才孫田珍長張相宋士謙鮮于暉紹成子休鮮于阿丁思和張阿張于舉趙榮海趙紹田山伯王長賢田標子董宛軌劉阿考遵齊神輝鮮于文達鮮于世榮焚阿伏張阿雅梁阿沙業梁賢阿田胡士無張難李阿貴齊阿太董衍宗格阿業李醜漢鮮于榮顯趙市興梁士史仲阿禮士方年市苑外鮮于士子祕叔祖修羅史子恭史江海張阿紹王阿義胡仲軌張士周繼纂路貴子王魔田寧田子史士封田望史李幽田孝讓鮮于孟禮郤神敬張士趙乾之八南面夫至宗幽微非輕重可以挹其源大道沖賾何香臰所能究其始自非旃檀在束暫似牛頭飛水騰虛瞥如叉股一月常圓千奴恆備焉足致六師於河中集法軍於不退地者也是以斧利雖盈不可濟其終身鞭柩責罪寧復救其時困靡求度世之資而罰埿牛之厄穀賊不易可除摩尸何由能待當須清淨六塵洗結煩惱行六波羅蜜具三不退轉成熟粳米即此誰興柔濡于草於茲何立無蒔善牙之子而責寶池八流不入毗尼之菀欲悉律提之囿斯蓋孤寒之守斫杖絶羽之向清天自可斷膂於長眠之地槃錯於溟溟之水安能變三有而受樂出過一切苦而已者矣值魏孝昌之季塵驚塞表杜葛猖狂乘風間發蟻集蜂聚毒掠中原桑乾為虜馬之池燕趙成亂兵之地士不藝耨女無機杼行路阻絶音信虛懸殘害村薄鄰伍哀不相及屠戮城社所在皆如麻亂形骸暴露相看聚作丘山流血如河遠近翻為丹地仍有韓婁豹勃鳥急驚危趣走葪城鵄視藏戶遂復王道重艱原墅再絶由茲圮岸皇化不均矚我大齊神武皇帝應期受命威靈自天掃除凶醜廓清宇宙雄劍一麾塵消万里飄迸之徒於斯獲賴時有故人王興國七人等住帶城皆宿乘美業渡三災而弗壞經八難而不朽無待梧丘之詩自起大慈之心非關驛庭之哭共發哀憐之念乃磬心相率驅車歷境緣湪東西拾諸離骨既不能辨其男女誰復究其姓名乃合作一墳稱為鄉葬設供集僧情同親里於是乎人倫哀酸禽鳥悲咽言念其酷誰不痛歟墳墓於斯遂有處焉其時雖復公路遠通私塗尚阻百里絶煙投厝靡託仍有興國市貴去來墓傍休歇冢側嗟同葬之因緣念往人之業報遂興誓願賙給万有各勸妻孥抽割衣食負之九西南面釜提壺就茲墓左共設義食以拯飢虛於後荏苒因搆義堂武定二年有國統光師弟子沙門三藏法師曇遵稟資大德歷承沖旨體具五通心懷十力常以智惠救諸煩惱名盛南州邀致無因有摩訶檀越大都督盧文翼范陽湪人也望重寰中親交帝室沖素起於弱年風槩弘於壯歲洞解十號之方深達具足之海既承芳實朝夕敬慕久而通請方致神座仍及居士馮叔平居士路和仁等道俗弟子五十餘人別立清館四事供養敷揚祕教流通大乘五冬六夏首尾相繼鱗羽感其德音緇素服其惠了貴賤往來於是乎盛便於此義深助功德時有勑請法師始復乖阻都督息士朗者蓋是鳳室之雛龍家龍子氣岸天遒風光遠逸優遊物外無以世務在懷昂藏自得寧將榮祿革意直置逍遙正道坐臥清虛仍憂此義便為檀越與善無徵摧芳盛歲人之十西面百弗及四徒何仰馮居士昆者字叔平瀛州高陽人本與法師同味相親造次不捨因請至此其人愛善若流不忘朝夕重信如山行之必覆雅素清逸率有國士之風器度間閏義當吐納之遠諸子既為世宗五經足稱軌物舉必由規動則成矩真言祕典幽途玄趣隨情立教方便開張如彼鳴鐘應不能已如似懸流寫不知竭常於此義專心扶獎一愜既回衆情頓慕功業久存良實是歸但餘慶難憑白駒易驗哲人其頽誰不悲仰天保八年葬於義左因此刊勒兾永清音武定四年神武北狩敕道西移舊堂寥廓行人稍蕑乃復依隨官路改卜今營爰其經始厥堵靡立便有篤信弟子嚴僧安合宗夙藉道因早通幽旨握鏡懷珠金聲玉振見善猶如不及聞惡恨非千里重三寶其如天輕七珍同垢穢若父若子乃識乃親或前或後非貧非富正向十方一心大道氣與一切合衣生願共恆河聯口命各捨課田同營此業方圓多少皆如別題俱若布金誓無退易長陸於茲為洗浴之池平原由此成福業之海今生未生現世去世百億千億有身無身至功大業皆由此誠万世不朽實鐘斯德地其形勢也左跨明武右帶長逵却負清洳面臨觀臺花果綺迾懸同鹿墅之菀棟宇參差綽踰只桓之舍軒駕馳彩類卿雲之五色士女間雜狀丹青之紛披天保三年景烈皇帝駕指湯谷離宮義所時庶一餐深蒙優囋有路和仁者字思穆陽平清淵人也與馮生綢繆往日依隨法師聯翩積歲昔遊青齊之地時號貞儒曾過淄潁之間世稱千里識洞百家氏族宛若目綜諏六典經史併同掌物乃厭此嚻塵仍懷至業伏六賊於心中拔四蛇於胸內吐納清虛優遊正道窮智惠於德義場追散花於慈悲室即於此義尊之十一西北面而法師尚并仁從衣屣蒙預內齋時經一歲每以此義殷勤告請賴有敕許始得言歸於是獨主義徒晨夜吐握寤寐驚拊洰細不違年過知命婚娶首垂白髮篤意彌厚良實行伏鄉閭德兼邑外乃修造門堂改創墻院寶塔連雲共落照以爭輝甍宇接漢將危峯以鬱迾雖曰義坊無異茄藍園遠何殊奈苑莊矣麗矣難得而稱天保螽蟲之歲長圍作起之春公私往還南北滿路若軍若漢或文或武旦發者千群暮來者万隊楷若純陀之窮舍利香積曾何云愧兼復病者給藥死者磚埋齋送追悼皆如親戚仍以河清遭潦人多飢斃父子分張不相存救於此義食終不暫捨貴城市此之年未孰可具而論之天保十年獨孤使君寬仁愛厚慈流廣被不限微細有效必申便遣州都兼別駕李士合范陽郡功曹皇甫遵之十二北面首王興國義主路和仁義夫田鸞𮀷劉子賢尹貮樂孔明遠張宗悅賈陀仁孟阿鳳王世標賈定興鮮于洪寧鄭阿仲趙元伯鄭伯遠趙世交子路梁曇尚賈孟良張思雍龐猛雀張叔遵鮮于修羅王元方宋子彥董大雍鄭阿林楊那仁七十九人等具狀奏聞時蒙優旨依式標年尋有苻下于時草創未及旌建河清二年故范陽太守郭府君智見此至誠感降天旨喜於早舉明發不忘遂遣海懿鄉重郡功曹盧宣儒典從來至義堂令權立木柱以廣遠聞自爾於今未曾刊頌新令普班舊文改削諸為邑義例聽縣置二百餘人一身免役以彰厥美仍復年常考列定其進退便蒙令公據狀判申臺依下具如明案於是信心邑義維那張市寧牛阿雍李恆同呂季秀楊景賓范崇禮龍叔良陳叔希王僧雕李遠史苟仁田元休韓仲珍蔡顯雍劉高貴李同遵孫阿長史茂貞習定景周顯叔李惡仁李羅雲陳洪仙田叔彥董子彥范貮興劉子剛趙黃頭史景遵傅子漢鮮于孟昌田子長合二百人等皆如貢表悉是賢良可謂荊山之側白玉應生麗水之濱黃金自出翩翩有泗上之風雍雍秉槐下之節輕財重義衆意協和羽蓋莫不霄依飛軒靡不盡集此義書契已來未之有也我皇聖既無名神不可測或噡雲歸附望氣來賓次復文景成康豈得同年而語哉明使君大行臺尚書令斛律公名羡字豐落朔州部落人也公纍葉重輝其來自遠親踰梁鄧勳邁伊薑存意六韜留心三略既偏脫立戍架谷為城民安桑井之欣卒無擊柝之慮威振六蕃恩加百姓駟馬入覲屢過於此向寺若歸如父他還百里停餐屆義方食慰同慈母賚殊僧俗脫驂解架敬造之十三東北面尊像抽捨珍物共造義餐達摩好施於前公復踵福於後仍能不遺陋業曲照纖維實於斯義恆存經紀念木柱之易朽芳徽之不固天統三年十月八日教下郡縣以石代焉義士等感致竭愚誠不憚財力遠訪名山窮尋異谷遂得石柱一枚長一丈九尺既類琉攡還如紺色庶其鐫美無窮流芳永扇車騎大將軍范陽太守劉府君名仙字世逸定州中山人也公流馨積代軒冕相仍稟性溫恭懷仁操義幼步紫庭爵倫華伍毗讚青嶽德聞天聽勑授鄙郡慈厥預被來谷爾車路由此所軒義徒深加信敬獎厲妻子咸徹行資中外欣悅共拯飢饉桑下之士翻同晉世馮翼進粥於茲更新蒞政未幾弘澤沾濡境內漫洽枯榮偏潤異鏤徽猷以銘惠化郡功曹釋壽者都督盧文翼之孝孫義舊檀越士朗之元子體度舒卷從時敦崇禮義少慕父之十四東面風每言先人析薪豈不負荷者哉還為義檀越志存世業財力匡究有建忠將軍范陽縣令劉明府名徹字康買恆州高柳人也其人世藉餘芳家傳冠蓋曉悟機變抱節歸誠入毗王室出宰百里察姦超於西門慈政隆於浮虎濟上安民實曰明君仍好至理深慕清淨愛無頭眼惜非妻子以石柱高偉起功難立遂捨家資共相扶佐一力既齊衆情咸奮叫聲長碣峻起無異寶幢初建梵音布於原墅法鼓新擊歌囋遍於村邑但山挺万尋尚有成壑之期海深千刃猶致桑田之會未如金石一鎸共未有而同有芳音銘注將百代而常存乃為頌曰玄哉大業逖矣真人難逢難值誰識誰親之靡際欲住無因空瞻池水虛想金身飛河既易騰火不難所嗟斧利弗救飢寒法軍雖終謝香檀未如上空中試看真不採埿中取厄生亡環堵死無冢宅譬彼黃塵隨風阡陌不識皮毛誰辨骸骼矚茲大聖虎據龍驤剪除羣醜再立天綱千家如一万里歸鄉云誰之力賴我神皇有茲善信仁沾枯朽義等妻孥恩同父母拾胔骸共成一有與天長還從地久宇宙一清塵消万里城邑猶蕑村薄未幾去來女婦往還公子駱驛長途靡所厥止仍茲四輩心懷十力念此浮魂嗟於遊息近減家資遠憑此識於此冢傍遂為義食義存於此良實有年惟公惟帝或愚或賢深相優囋雅助留連因茲爽塏仍成福田一心堅固方寸傾回既如殞蘀復仰風雷三途可滅八難終摧云何濟彼唯善斯媒靈圖既作降勑仍隆標建堂宇用表始終高山可覆海水易窮其如金石永樹天中法界圓體空如如妄想紛搆三有星居求知悟理佛法僧徒梵音付傳説之十五東南面論經書進修始終賢聖凡夫行因獲果隆業差殊善惡不亡勿守癡愚敷衍五乘仁義非虛五常之行仁義先序惠輶如毛民鮮剋舉周觀齊域唯茲邑侶嚴氏施地安承創與坊類伽藍給孤汝羣英居之昭世若炬興國元首和仁為主賢哉卓異晈晈獨竪公主垂眄守令識覩毗讚傾席百僚揖語德伏鄉邦歸同雲雨樂捨財力弗辭貧苦營造供賓無避寒暑愍育路人如母茲父恩沾灰厄病瘦得愈美聞朝墅州貢天府御注依式省判通許覆敷事實苻賜標柱衆情共立遣建義所旌題首領衆免役苦梵厲後學言行稽古雕刊美迹流芳齊寓鑿石彰名遐劫不腐
